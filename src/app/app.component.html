<nav class="w-full flex justify-between items-center bg-white px-6 py-4 shadow-md fixed top-0 z-40">
  <!-- Logo + Menu burger -->
  <div class="flex items-center gap-4">
    <!-- Menu burger (visible uniquement sur mobile) -->
    <button class="lg:hidden text-gray-600">
      <i class="fas fa-bars fa-xl"></i>
    </button>

    <!-- Logo -->
    <img src="assets/logos/logo SJI.png" alt="Logo IUSJ" class="w-40 hidden lg:inline" />
  </div>

  <!-- Zone droite : utilisateur -->
  <div class="flex items-center gap-3 w-1/3 justify-end infos_user" id="messageDropdown">
    <!-- Nom visible seulement en desktop -->
    <span class="font-medium text-gray-600 hidden lg:inline">Johan Touko</span>
    <div class="w-10 h-10 text-white rounded-lg flex items-center justify-center font-medium"
      style="background-color: var(--red-opacity-color);">
      JP
    </div>

<div class="fixed top-0 left-0 h-full w-35 bg-white z-30 transform transition-transform duration-300 lg:translate-x-0"
  [ngClass]="{ '-translate-x-full': visible, 'translate-x-0': !visible }">
  <aside class="w-35 bg-white h-full shadow-md fixed top-0 left-0 lg:pt-22 pt-24 z-30 lg:block">
    <div class="flex flex-col gap-3 px-2">
      @for (item of menuItems; track item.label) {
      <button class="flex flex-col items-center py-2 text-gray-500 hover:text-black px-4 nav_element"
        [routerLink]="item.route" [ngClass]="{'nav_active': isActiveRoute(item.route)}">
        <i [ngClass]="item.icon" class="text-2xl mb-2"></i> <!-- Icône en haut -->
        <span class=" lg:text-sm 2xl:text-lg">{{item.label}}</span> <!-- Texte en bas -->
      </button>
      }
    </div>
    <div class="absolute bottom-6 w-full text-center px-4">
      <button class="text-red-500 border border-red-500 px-4 py-2 rounded hover:bg-red-50 w-full cursor-pointer"><span
          class="mr-2 text-red-500"><i class="fas fa-sign-out-alt"></i></span>Déconnexion</button>
    </div>
  </aside>
</div>


<!-- Menu Dropdown -->

        <span class="lg:text-sm 2xl:text-lg">My Messages</span>
      </button>
      <button class="flex items-center py-2 text-gray-500 hover:text-black px-4">

        <span class="lg:text-sm 2xl:text-lg">My Activities</span>

      <button class="flex items-center py-2 text-gray-500 hover:text-black px-4">

      <button class="flex items-center py-2 text-gray-500 hover:text-black px-4">
