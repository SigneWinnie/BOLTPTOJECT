stages:
  - build
  - push
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE:latest

# Étape 1 : Build de l'image Docker
build:
  stage: build
  image: docker:27.0.3
  services:
    - docker:dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -t $IMAGE_NAME .
  artifacts:
    paths:
      - Dockerfile
    expire_in: 1h
  only:
    - main

# Étape 2 : Push de l'image vers GitLab Registry
push:
  stage: push
  image: docker:27.0.3
  services:
    - docker:dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker push $IMAGE_NAME
  dependencies:
    - build
  only:
    - main

